<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#0b1220"/>
  <text x="500" y="40" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="middle">Joystick-Controlled RGB LED Sequencer - Circuit Diagram</text>

  <rect x="90" y="140" width="260" height="360" rx="14" fill="#0f2437" stroke="#14b8a6" stroke-width="2.5"/>
  <text x="220" y="175" fill="#5eead4" font-size="18" font-weight="700" text-anchor="middle">ARDUINO UNO</text>
  <rect x="115" y="195" width="210" height="140" rx="6" fill="#0b1a29" stroke="#1f3b4d"/>
  <text x="220" y="270" fill="#64748b" font-size="12" text-anchor="middle">ATmega328P</text>

  <g font-size="13" fill="#f8fafc">
    <circle cx="352" cy="220" r="5" fill="#38bdf8"/><text x="365" y="225">A0</text>
    <circle cx="352" cy="360" r="5" fill="#4ade80"/><text x="365" y="365">D5</text>
    <circle cx="352" cy="395" r="5" fill="#60a5fa"/><text x="365" y="400">D6</text>
    <circle cx="352" cy="430" r="5" fill="#facc15"/><text x="365" y="435">D7</text>
    <circle cx="352" cy="465" r="5" fill="#ef4444"/><text x="365" y="470">5V</text>
    <circle cx="352" cy="480" r="5" fill="#94a3b8"/><text x="365" y="485">GND</text>
  </g>

  <rect x="620" y="70" width="220" height="150" rx="14" fill="#1a1030" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="730" y="100" fill="#c4b5fd" font-size="16" font-weight="700" text-anchor="middle">JOYSTICK MODULE</text>
  <rect x="700" y="115" width="60" height="60" rx="30" fill="#2d1b4e" stroke="#a78bfa"/>
  <circle cx="730" cy="145" r="14" fill="#c4b5fd"/>
  <g font-size="12" fill="#e9d5ff">
    <circle cx="628" cy="200" r="4" fill="#94a3b8"/><text x="638" y="204">GND</text>
    <circle cx="672" cy="200" r="4" fill="#ef4444"/><text x="682" y="204">+5V</text>
    <circle cx="716" cy="200" r="4" fill="#38bdf8"/><text x="726" y="204">VRx</text>
    <circle cx="760" cy="200" r="4" fill="#475569"/><text x="770" y="204">VRy (unused)</text>
  </g>

  <g id="green-led">
    <circle cx="700" cy="330" r="18" fill="#052e16" stroke="#4ade80" stroke-width="2.5"/>
    <circle cx="700" cy="330" r="7" fill="#4ade80"/>
    <text x="700" y="365" fill="#4ade80" font-size="13" text-anchor="middle" font-weight="600">Green LED</text>
    <rect x="600" y="322" width="50" height="16" rx="3" fill="#f59e0b"/>
    <text x="625" y="315" fill="#f59e0b" font-size="11" text-anchor="middle">220ohm</text>
  </g>

  <g id="blue-led">
    <circle cx="700" cy="400" r="18" fill="#0c1a3d" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="700" cy="400" r="7" fill="#60a5fa"/>
    <text x="700" y="435" fill="#60a5fa" font-size="13" text-anchor="middle" font-weight="600">Blue LED</text>
    <rect x="600" y="392" width="50" height="16" rx="3" fill="#f59e0b"/>
    <text x="625" y="385" fill="#f59e0b" font-size="11" text-anchor="middle">220ohm</text>
  </g>

  <g id="yellow-led">
    <circle cx="700" cy="470" r="18" fill="#3f2f05" stroke="#facc15" stroke-width="2.5"/>
    <circle cx="700" cy="470" r="7" fill="#facc15"/>
    <text x="700" y="505" fill="#facc15" font-size="13" text-anchor="middle" font-weight="600">Yellow LED</text>
    <rect x="600" y="462" width="50" height="16" rx="3" fill="#f59e0b"/>
    <text x="625" y="455" fill="#f59e0b" font-size="11" text-anchor="middle">220ohm</text>
  </g>

  <line x1="850" y1="330" x2="850" y2="490" stroke="#94a3b8" stroke-width="2"/>
  <text x="862" y="415" fill="#94a3b8" font-size="12">GND rail</text>

  <path d="M628,204 C500,204 500,480 352,480" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M672,204 C560,204 560,465 352,465" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M716,204 C560,204 560,220 352,220" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <path d="M600,330 C450,330 450,360 352,360" fill="none" stroke="#4ade80" stroke-width="2"/>
  <path d="M600,400 C460,400 460,395 352,395" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M600,470 C470,470 470,430 352,430" fill="none" stroke="#facc15" stroke-width="2"/>

  <line x1="718" y1="330" x2="850" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <line x1="718" y1="400" x2="850" y2="400" stroke="#94a3b8" stroke-width="2"/>
  <line x1="718" y1="470" x2="850" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <path d="M850,490 C850,530 400,530 352,480" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <g font-size="12" fill="#cbd5e1">
    <text x="90" y="560">Legend:</text>
    <line x1="150" y1="556" x2="180" y2="556" stroke="#ef4444" stroke-width="3"/><text x="188" y="560">Power (5V)</text>
    <line x1="290" y1="556" x2="320" y2="556" stroke="#94a3b8" stroke-width="3"/><text x="328" y="560">Ground</text>
    <line x1="410" y1="556" x2="440" y2="556" stroke="#38bdf8" stroke-width="3"/><text x="448" y="560">Signal</text>
  </g>
  <text x="500" y="600" fill="#64748b" font-size="12" text-anchor="middle">Only VRx (X-axis) is used in code - VRy and SW pins are left unconnected</text>
</svg>
