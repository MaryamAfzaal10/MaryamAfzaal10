<svg viewBox="0 0 1050 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1050" height="700" fill="#0b1220"/>
  <text x="525" y="40" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="middle">Fire and Sound Alert System - Circuit Diagram</text>

  <rect x="70" y="150" width="250" height="440" rx="14" fill="#0f2437" stroke="#14b8a6" stroke-width="2.5"/>
  <text x="195" y="180" fill="#5eead4" font-size="18" font-weight="700" text-anchor="middle">ARDUINO UNO</text>
  <rect x="95" y="200" width="200" height="130" rx="6" fill="#0b1a29" stroke="#1f3b4d"/>
  <text x="195" y="270" fill="#64748b" font-size="12" text-anchor="middle">ATmega328P</text>

  <g font-size="13" fill="#f8fafc">
    <circle cx="322" cy="360" r="5" fill="#f472b6"/><text x="335" y="365">D2 - LCD D7</text>
    <circle cx="322" cy="385" r="5" fill="#f472b6"/><text x="335" y="390">D3 - LCD D6</text>
    <circle cx="322" cy="410" r="5" fill="#f472b6"/><text x="335" y="415">D4 - LCD D5</text>
    <circle cx="322" cy="435" r="5" fill="#f472b6"/><text x="335" y="440">D5 - LCD D4</text>
    <circle cx="322" cy="460" r="5" fill="#c084fc"/><text x="335" y="465">D6 - LCD EN</text>
    <circle cx="322" cy="485" r="5" fill="#c084fc"/><text x="335" y="490">D7 - LCD RS</text>
    <circle cx="322" cy="510" r="5" fill="#fb923c"/><text x="335" y="515">D8 - Buzzer</text>
    <circle cx="322" cy="535" r="5" fill="#facc15"/><text x="335" y="540">D9 - Sound Sensor OUT</text>
    <circle cx="322" cy="560" r="5" fill="#f87171"/><text x="335" y="565">D10 - Flame Sensor DO</text>
    <circle cx="322" cy="585" r="5" fill="#ef4444"/><text x="335" y="590">5V</text>
    <circle cx="322" cy="605" r="5" fill="#94a3b8"/><text x="335" y="610">GND</text>
  </g>

  <rect x="640" y="70" width="330" height="150" rx="10" fill="#052e1c" stroke="#4ade80" stroke-width="2.5"/>
  <text x="805" y="98" fill="#86efac" font-size="16" font-weight="700" text-anchor="middle">16x2 LCD DISPLAY</text>
  <rect x="665" y="110" width="280" height="80" rx="4" fill="#031f13" stroke="#166534"/>
  <text x="805" y="140" fill="#4ade80" font-size="18" font-family="monospace" text-anchor="middle">System OK</text>
  <text x="805" y="165" fill="#4ade80" font-size="13" font-family="monospace" text-anchor="middle">Monitoring...</text>
  <g font-size="11" fill="#bbf7d0">
    <text x="670" y="205">RS EN D4 D5 D6 D7  VSS RW K  VDD A</text>
  </g>

  <g id="flame-sensor">
    <rect x="640" y="250" width="140" height="90" rx="8" fill="#3f0d0d" stroke="#f87171" stroke-width="2"/>
    <text x="710" y="275" fill="#fca5a5" font-size="13" text-anchor="middle" font-weight="600">Flame Sensor</text>
    <text x="710" y="292" fill="#fca5a5" font-size="11" text-anchor="middle">(HW-484)</text>
    <text x="710" y="310" fill="#fca5a5" font-size="10" text-anchor="middle">DO GND VCC</text>
    <text x="710" y="326" fill="#fca5a5" font-size="9" text-anchor="middle">LOW = flame detected</text>
  </g>

  <g id="sound-sensor">
    <rect x="800" y="250" width="140" height="90" rx="8" fill="#3f3305" stroke="#facc15" stroke-width="2"/>
    <text x="870" y="275" fill="#fde047" font-size="13" text-anchor="middle" font-weight="600">Sound Sensor</text>
    <text x="870" y="292" fill="#fde047" font-size="11" text-anchor="middle">(Mic module)</text>
    <text x="870" y="310" fill="#fde047" font-size="10" text-anchor="middle">OUT GND VCC</text>
    <text x="870" y="326" fill="#fde047" font-size="9" text-anchor="middle">HIGH = loud sound</text>
  </g>

  <g id="buzzer">
    <circle cx="710" cy="420" r="35" fill="#3f1d05" stroke="#fb923c" stroke-width="2.5"/>
    <text x="710" y="425" fill="#fdba74" font-size="12" text-anchor="middle" font-weight="600">Buzzer</text>
    <text x="710" y="470" fill="#fdba74" font-size="10" text-anchor="middle">+ / GND</text>
  </g>

  <line x1="580" y1="230" x2="580" y2="640" stroke="#94a3b8" stroke-width="2"/>

  <path d="M665,205 C450,205 450,485 322,485" fill="none" stroke="#c084fc" stroke-width="2"/>
  <path d="M690,205 C440,205 440,460 322,460" fill="none" stroke="#c084fc" stroke-width="2"/>
  <path d="M715,205 C430,205 430,435 322,435" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M740,205 C420,205 420,410 322,410" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M765,205 C410,205 410,385 322,385" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M790,205 C400,205 400,360 322,360" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M865,205 C610,225 610,585 322,585" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M845,205 C580,225 580,605 322,605" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M710,250 C500,250 500,560 322,560" fill="none" stroke="#f87171" stroke-width="2"/>
  <path d="M660,340 C560,360 560,605 322,605" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M760,340 C620,370 620,585 322,585" fill="none" stroke="#ef4444" stroke-width="2"/>

  <path d="M870,250 C520,250 520,535 322,535" fill="none" stroke="#facc15" stroke-width="2"/>
  <path d="M820,340 C650,380 650,605 322,605" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M920,340 C700,390 700,585 322,585" fill="none" stroke="#ef4444" stroke-width="2"/>

  <path d="M710,385 C500,385 500,510 322,510" fill="none" stroke="#fb923c" stroke-width="2"/>
  <path d="M700,450 C550,470 550,605 322,605" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <text x="525" y="670" fill="#64748b" font-size="12" text-anchor="middle">Flame + Sound sensor modules use their onboard comparator (digital OUT) - no extra resistors needed</text>
</svg>
